name: iOS Release
on:
  push:
    branches: [main, 'codex/**']
    tags: ['ios-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      signed:
        description: '使用 Apple 发行证书签名并导出 IPA'
        type: boolean
        default: false
      export_method:
        description: '导出方式（须与 provisioning profile 匹配）'
        type: choice
        options: [ad-hoc, app-store, development]
        default: ad-hoc
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake ninja xcodegen
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: build/native
          key: native-ios16-simulator-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'Scripts/build.sh', 'Vendor/PitcheeCore/src/**', 'Vendor/PitcheeCore/include/**') }}
      - run: bash Scripts/build.sh iphonesimulator
        if: steps.native-cache.outputs.cache-hit != 'true'
      - run: xcodegen generate
        if: steps.native-cache.outputs.cache-hit == 'true'
      - name: Test Swift and bundled model inference on simulator
        run: |
          set -euo pipefail
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["isAvailable"]))')
          xcodebuild -project Pitchee.xcodeproj -scheme Pitchee -configuration Release \
            -destination "platform=iOS Simulator,id=$simulator" \
            -resultBundlePath build/TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-TestResults
          path: build/TestResults.xcresult
  build:
    needs: test
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed || false }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'space.pitchee.ios' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install cmake ninja xcodegen
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: build/native
          key: native-ios16-device-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'Scripts/build.sh', 'Vendor/PitcheeCore/src/**', 'Vendor/PitcheeCore/include/**') }}
      - name: Build native inference libraries and generate Xcode project
        run: bash Scripts/build.sh iphoneos
        if: steps.native-cache.outputs.cache-hit != 'true'
      - run: xcodegen generate
        if: steps.native-cache.outputs.cache-hit == 'true'
      - name: Import signing assets
        if: env.SIGNED == 'true'
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: bash Scripts/signing.sh
      - name: Archive release
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          args=(CODE_SIGNING_ALLOWED=NO)
          if [[ "$SIGNED" == true ]]; then
            args=(CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID")
          fi
          xcodebuild -project Pitchee.xcodeproj -scheme Pitchee -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Pitchee.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${args[@]}" archive
      - name: Package unsigned IPA
        if: env.SIGNED != 'true'
        run: |
          mkdir -p build/package/Payload build/output
          cp -R build/Pitchee.xcarchive/Products/Applications/Pitchee.app build/package/Payload/
          cd build/package
          zip -qry ../output/Pitchee-unsigned.ipa Payload
      - name: Export signed IPA
        if: env.SIGNED == 'true'
        run: xcodebuild -exportArchive -archivePath build/Pitchee.xcarchive -exportPath build/output -exportOptionsPlist build/ExportOptions.plist
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pitchee-iOS-${{ github.run_number }}
          path: build/output/*.ipa
          if-no-files-found: error
      - name: Remove signing assets
        if: always() && env.SIGNED == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/pitchee.keychain-db" || true
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
  release:
    if: startsWith(github.ref, 'refs/tags/ios-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pitchee-iOS-${{ github.run_number }}
          path: output
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" output/*.ipa --repo "$GITHUB_REPOSITORY" \
            --title "Pitchee iOS $GITHUB_REF_NAME" \
            --notes 'Unsigned iOS Release build. Requires valid signing before installation. 未签名 IPA，需自行签名后安装。'

