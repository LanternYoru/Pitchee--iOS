name: Pitchee
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: space.pitchee.ios
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_INCLUDE_PATHS: '$(SRCROOT)/Vendor/PitcheeCore/platform/ios'
    HEADER_SEARCH_PATHS: '$(SRCROOT)/Vendor/PitcheeCore/include'
targets:
  Pitchee:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [Knowledge, Licenses]
      - path: Sources/Licenses
        type: folder
        buildPhase: resources
      - path: Sources/Knowledge
        type: folder
        buildPhase: resources
      - path: Vendor/PitcheeCore/models
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于录音、实时音高与本地声音分析。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pitchee
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_INCLUDE_PATHS: '$(SRCROOT)/Vendor/PitcheeCore/platform/ios'
        HEADER_SEARCH_PATHS: '$(SRCROOT)/Vendor/PitcheeCore/include'
        LIBRARY_SEARCH_PATHS: '$(SRCROOT)/build/native/lib'
        OTHER_LDFLAGS: ['$(inherited)', '-lpitchee_core', '-lncnn', '-lc++']
    dependencies:
      - sdk: Accelerate.framework
      - sdk: AVFoundation.framework
  PitcheeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: space.pitchee.ios.tests
    dependencies:
      - target: Pitchee
schemes:
  Pitchee:
    build:
      targets:
        Pitchee: all
    test:
      targets: [PitcheeTests]
